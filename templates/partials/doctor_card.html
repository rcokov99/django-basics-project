<div class="card h-100 shadow-sm doctor-card">
    <div class="card-body d-flex flex-column">
        <h5 class="card-title">Dr. {{ doctor.full_name }}</h5>
        <h6 class="card-subtitle mb-2 text-muted">{{ doctor.specialty }}</h6>

        <p class="mb-1">
            <span class="badge bg-primary">{{ doctor.department.name }}</span>
        </p>
        <p class="mb-1 text-muted small">
            {{ doctor.years_of_experience }} year{{ doctor.years_of_experience|pluralize }} of experience
        </p>
        <p class="rating mb-2">
            ⭐ {{ doctor.avg_rating|default_if_none:0|floatformat:1 }} / 5
        </p>

        <p class="card-text">{{ doctor.bio|truncatewords:20 }}</p>

        <a href="{% url 'specialists:doctor-detail' doctor.pk %}"
           class="btn btn-outline-primary mt-auto">View profile</a>
    </div>
</div>
